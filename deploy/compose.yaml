# Run from the repository root:
#   podman-compose -f deploy/compose.yaml up --build -d
# (docker compose works with the same file.)
name: paul

services:
  paul:
    image: ${PAUL_IMAGE:-localhost/paul:dev}
    build:
      context: ..
      dockerfile: deploy/Containerfile
    ports:
      - "${PAUL_PORT:-8080}:8080"
    volumes:
      - paul-data:/data
    restart: unless-stopped

volumes:
  paul-data:
