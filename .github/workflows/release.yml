name: Release

# Push a tag like v0.1.0 to publish:
#   - container image to ghcr.io/<owner>/paul:<version> and :latest
#   - a GitHub Release with the runnable jar and the compose file attached
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract jar from image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          id=$(docker create "$image")
          docker cp "$id:/app/paul.jar" "paul-${GITHUB_REF_NAME}.jar"
          docker rm "$id"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Paul $GITHUB_REF_NAME" \
            --generate-notes \
            "paul-${GITHUB_REF_NAME}.jar" \
            deploy/compose.yaml
