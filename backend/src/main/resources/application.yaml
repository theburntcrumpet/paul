spring:
  application:
    name: paul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    locations: classpath:db/migration

paul:
  data-dir: ${PAUL_DATA_DIR:./data}
  security:
    initial-admin-password: ${PAUL_ADMIN_PASSWORD:admin}

server:
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
